// build jar
void createJarTask(String name, String classifier, String desc, boolean withJar = true, FileCollection configuration = configurations.runtimeClasspath) {
    // tasks.create(name: name, type: Jar) {
    tasks.register(name, Jar) {
        group = 'build'
        description = desc
        archiveClassifier = classifier
        // leave the file/entry that was first copied/created in place
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF'

        manifest.from jar.manifest
        from {
            // findAll { it.name.endsWith('.jar') }: filter something else, such as *.pom
            configuration.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
            // (configuration1 + configuratio2).findAll { ... }
        }
        if (withJar) {
            // with jar.rootSpec
            from sourceSets.main.output
        }
    }
}

plugins.withType(JavaPlugin).configureEach {
    // zip all classes include deps to a fat jar
    createJarTask('fatJar', 'all', 'Build a fat jar with all dependencies')
    // copy all dep jar to a dir
    createJarTask('depJar', 'dep', 'Build a fat jar with all dependencies without classes', false)

    tasks.register("allJar") {
        group = 'build'
        description = 'Build all jars, include jar, depJar and fatJar'
        dependsOn jar, depJar, fatJar
    }

    // ./gradlew copyDep -Pclasspath=compile
    tasks.register("copyDep", Copy) {
        group = 'build'
        description = 'Copy all dep jars to build/dep'
        // destinationDir = file("${layout.buildDirectory.getAsFile().get()}/dep")
        into(layout.buildDirectory.dir('dep'))

        def classpathName = findProperty('classpath') ?: 'runtime'
        def classpath = configurations.named("${classpathName}Classpath").get()
        from {
            classpath.findAll { it.name.endsWith('.jar') }
        }
    }

    tasks.register("descDep") {
        group = 'help'
        description = 'Print all dep filename'

        doLast {
            def classpath = findProperty('classpath') == 'compile' ?
                    configurations.compileClasspath : configurations.runtimeClasspath

            classpath.findAll { it.name.endsWith('.jar') }.forEach {
                println(it.path)
            }
        }
    }
}

void createConfigurationAndJarTask(String name, String classifier, String desc, Configuration... extraConfigurations) {
    def configuration = configurations.maybeCreate(name)
    def classpath = configurations.maybeCreate("${name}Classpath")
    classpath.extendsFrom(configuration, *extraConfigurations)

    createJarTask(name, classifier, desc, true, classpath)
}

// noinspection GroovyAssignabilityCheck
ext.createConfigurationAndJarTask = this.&createConfigurationAndJarTask
